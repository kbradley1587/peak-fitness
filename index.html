<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak Fitness Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#EEF2F5; --paper:#FFFFFF; --ink:#10283A; --ink-2:#44596A; --ink-3:#8A9AA8;
  --line:#D5DDE4; --ridge:#1F4D6B; --ridge-2:#2C6A8F; --summit:#F0A52B; --summit-ink:#5A3A00;
  --go:#2F8F74; --warn:#C4432B; --card:#FFFFFF; --field:#F6F8FA;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --snow:#0C1B26; --paper:#122534; --ink:#EEF2F5; --ink-2:#B6C3CD; --ink-3:#7C8E9C;
  --line:#243B4C; --ridge:#3F85B0; --ridge-2:#5AA3CF; --summit:#F5B547; --summit-ink:#3A2600;
  --card:#122534; --field:#0F2030;
}}
:root[data-theme="dark"]{
  --snow:#0C1B26; --paper:#122534; --ink:#EEF2F5; --ink-2:#B6C3CD; --ink-3:#7C8E9C;
  --line:#243B4C; --ridge:#3F85B0; --ridge-2:#5AA3CF; --summit:#F5B547; --summit-ink:#3A2600;
  --card:#122534; --field:#0F2030;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--snow);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--summit);outline-offset:2px}

/* shell */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:-2px}
nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs a{text-decoration:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2)}
nav.tabs a.on{background:var(--ink);color:var(--snow)}
main{max-width:1080px;margin:0 auto;padding:8px 20px 110px}
@media (min-width:760px){ main{padding-bottom:60px} }
.mobilenav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.mobilenav a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 0}
.mobilenav a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.mobilenav a.on{color:var(--ink)}
@media (min-width:760px){ .mobilenav{display:none} }
@media (max-width:759px){ nav.tabs{display:none} }

.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(12,28,40,.94) 0%,rgba(12,28,40,.72) 45%,rgba(12,28,40,.45) 100%),linear-gradient(0deg,rgba(12,28,40,.75) 0%,rgba(12,28,40,0) 55%)}
.hero>*{position:relative}
.herohead{display:grid;gap:14px}
@media (min-width:760px){ .herohead{grid-template-columns:1fr 1fr;align-items:end;gap:32px} .hero{padding:36px 34px} }
.eyebrow{margin:0 0 6px;font-size:14px;font-weight:500;opacity:.85}
.hero h1{font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-.005em}
.hero .lede{margin:0;opacity:.9;font-size:16px;max-width:46ch}
@media (min-width:760px){ .hero .lede{justify-self:end;text-align:right} }
.podium{display:grid;grid-template-columns:1fr;gap:10px;margin-top:24px}
@media (min-width:640px){ .podium{grid-template-columns:repeat(3,1fr)} }
.podium.empty{display:block;padding:18px 20px;border:1px solid rgba(255,255,255,.18);border-radius:12px;opacity:.8}
.p{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px 18px 16px;background:rgba(12,28,40,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.p.p1{background:#F3F6F8;color:#10283A;border-color:#F3F6F8}
.p .rk{font-family:var(--display);font-size:16px;font-weight:600;opacity:.6}
.p.p1 .rk{color:var(--summit-ink);opacity:1;background:var(--summit);display:inline-block;padding:1px 8px;border-radius:999px}
.p .nm{font-family:var(--display);font-size:30px;font-weight:700;margin-top:6px;line-height:1}
.p .pts{font-family:var(--display);font-size:46px;font-weight:700;margin-top:10px;line-height:1;font-variant-numeric:tabular-nums}
.p .pts small{font-family:var(--body);font-size:13px;font-weight:500;margin-left:6px;opacity:.7}
.p .meta{font-size:13px;opacity:.7;margin-top:10px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media (min-width:760px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.tile .l{color:var(--ink-2);font-size:14px;margin-top:4px}
.tile .s{color:var(--ink-3);font-size:13px;margin-top:2px}
.tile.ch{grid-column:1/-1;background:var(--ink);color:var(--snow);border-color:var(--ink);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tile.ch .v{font-size:30px;color:var(--summit)}
.tile.ch .l,.tile.ch .s{color:var(--snow);opacity:.85}
.tile.ch .lead{margin-left:auto;text-align:right}
@media (min-width:760px){ .tile.ch{grid-column:span 4} }

/* table */
.board{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 10px}
.board h2{font-size:28px}
.board .sub{color:var(--ink-3);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap}
th{font-size:13px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
td.rk{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink-3);text-align:left;width:52px}
tr.r1 td.rk{color:var(--summit)}
td.pts{font-family:var(--display);font-size:22px;font-weight:700}
td .nm{font-weight:600}
td .you{font-size:12px;color:var(--go);font-weight:600;margin-left:6px}
.streak{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--field);font-size:13px;font-weight:600}
.streak.hot{background:var(--summit);color:var(--summit-ink)}

/* forms & cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card+.card{margin-top:16px}
.card h2{font-size:30px}
.card p.hint{color:var(--ink-2);margin:6px 0 0}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){ .grid2{grid-template-columns:1fr 1fr} }
label.f{display:block}
label.f span{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:12px 14px;font-size:17px}
.in:focus{border-color:var(--ridge)}
textarea.in{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:600;font-size:16px;cursor:pointer;background:var(--ink);color:var(--snow)}
.btn.sum{background:var(--summit);color:var(--summit-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:12px 14px;cursor:pointer;user-select:none}
.toggle b{font-weight:600}
.toggle small{display:block;color:var(--ink-3);font-weight:500}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--go)}
.toggle.on .sw::after{transform:translateX(18px)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:18px}
.pinpad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-family:var(--display);font-size:28px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--line)}
.dots{display:flex;gap:12px;justify-content:center;margin-top:16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.who button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.who button.on{background:var(--ink);color:var(--snow);border-color:var(--ink)}
.err{color:var(--warn);font-weight:600;text-align:center;margin-top:10px;min-height:1.4em}
.live{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--snow);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;box-shadow:0 10px 30px rgba(16,40,58,.25)}
@media (min-width:760px){ .live{bottom:16px} }
.live .v{font-family:var(--display);font-size:34px;font-weight:700;color:var(--summit)}
.live .l{font-size:13px;opacity:.8}
.live .br{display:flex;gap:14px;font-size:13px;opacity:.9;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--go);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (min-width:760px){ .toast{bottom:30px} }

/* me */
.mehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mehead h1{font-size:clamp(40px,8vw,64px);font-weight:800}
.mehead .rank{font-family:var(--display);font-size:64px;font-weight:800;color:var(--summit);line-height:1}
.mehead .rank small{display:block;font-family:var(--body);font-size:14px;color:var(--ink-2);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:10px}
.bars div{background:var(--ridge);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars div.today{background:var(--summit)}
.bars div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--ink-3);text-align:center;margin-top:6px}
.hist{margin-top:14px;display:grid;gap:8px}
.hist .h{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--field)}
.hist .h b{font-family:var(--display);font-size:22px}
.hist .h small{color:var(--ink-3)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;background:var(--field)}
.badge.earned{background:var(--summit);border-color:var(--summit);color:var(--summit-ink)}
.badge:not(.earned){opacity:.5}

/* coach */
.roster{display:grid;gap:10px}
.roster .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--field)}
.roster .r .nm{font-weight:600}
.roster .r .pin{font-family:var(--display);font-size:20px;letter-spacing:.15em;color:var(--ink-2)}
.ptgrid{display:grid;grid-template-columns:1fr 90px;gap:8px 12px;align-items:center}
.ptgrid span{font-size:15px}
.chal{display:grid;gap:10px}
.chal .c{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--field);display:grid;grid-template-columns:1fr auto;gap:8px}
.chal .c.now{border-color:var(--summit);background:var(--paper)}
.chal .c b{font-weight:600}
.chal .c small{color:var(--ink-3)}
.note{background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#/">
    <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M2 30 L13 9 L19 18 L23 12 L32 30 Z" fill="var(--ridge)"/><path d="M13 9 L16 14 L11 16 Z" fill="var(--summit)"/></svg>
    <div><b>Peak Fitness</b><span>Weekly challenge</span></div>
  </a>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="app"></main>
<nav class="mobilenav" id="mnav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- data layer (swap this object for Supabase later) ---------- */
const KEY='peakfit.v1';
const DEFAULTS={
  coachPin:'1234',
  points:{checkin:5,workout:20,otherWorkout:10,sunlight:5,steps1:5,steps2:10,steps3:15,sleep:5,water:5,protein:5,mobility:5,streak:25,encourage:5},
  thresholds:{steps1:7500,steps2:10000,steps3:12500,sleep:7,water:8},
  clients:[
    {id:'c1',name:'Kayla',pin:'1111'},{id:'c2',name:'Aaron',pin:'2222'},{id:'c3',name:'Pat',pin:'3333'},
    {id:'c4',name:'Kevin',pin:'4444'},{id:'c5',name:'Amanda',pin:'5555'},{id:'c6',name:'Marky D',pin:'6666'}
  ],
  challenges:[
    {week:1,name:'70K Step Battle',how:'Most total steps for the week',bonus:50,metric:'steps'},
    {week:2,name:'Workout Warrior',how:'Most completed workouts',bonus:50,metric:'workouts'},
    {week:3,name:'Sleep Strong',how:'Most nights at 7+ hours',bonus:50,metric:'sleepDays'},
    {week:4,name:'Consistency Crown',how:'Most complete check-in days',bonus:50,metric:'checkins'},
    {week:5,name:'Accountability MVP',how:'Most encouragement check-ins',bonus:50,metric:'encourage'},
    {week:6,name:'Hydration Hero',how:'Most days hitting the water goal',bonus:50,metric:'waterDays'}
  ],
  challengeStart:null, // ISO date of week 1 Monday; set on first load
  awards:{}, // {weekKey: clientId}
  checkins:[]
};
let S=null;
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw);}}catch(e){S=null}
  if(S&&S.points&&S.points.otherWorkout==null){S.points.otherWorkout=10;S.checkins.forEach(c=>{if(c.otherWorkout==null)c.otherWorkout=false});save()}
  if(S&&S.points&&S.points.sunlight==null){S.points.sunlight=5;S.checkins.forEach(c=>{if(c.sunlight==null)c.sunlight=false});save()}
  if(!S){S=JSON.parse(JSON.stringify(DEFAULTS)); S.challengeStart=iso(weekStart(new Date())); seed(); save();}
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function reset(){ try{localStorage.removeItem(KEY)}catch(e){} S=null; load(); }

/* ---------- dates ---------- */
const DAY=86400000;
function iso(d){const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)}
function fromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}
function today(){return iso(new Date())}
function hm(h){if(!h)return '0h';const H=Math.floor(h),M=Math.round((h-H)*60);return M?`${H}h ${M}m`:`${H}h`}
function fmt(d){return fromIso(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function weekDays(ws){return Array.from({length:7},(_,i)=>iso(new Date(fromIso(ws).getTime()+i*DAY)))}
function currentWeekKey(){return iso(weekStart(new Date()))}
function weekNumber(){const ws=weekStart(new Date()),cs=fromIso(S.challengeStart);return Math.max(1,Math.round((ws-cs)/(7*DAY))+1)}

/* ---------- seed demo data (deterministic) ---------- */
function seed(){
  let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
  const profiles={c1:.7,c2:.5,c3:.35,c4:.6,c5:.9,c6:.8};
  const types=['Weight training','Run','Cycling','HIIT','Yoga','Swim'];
  const t=new Date();
  for(let back=9;back>=0;back--){
    const d=iso(new Date(t.getTime()-back*DAY));
    S.clients.forEach(c=>{
      const p=profiles[c.id];
      if(rnd()>p*1.1) return; // missed day
      const didW=rnd()<p,workout=didW&&rnd()<.6,otherWorkout=didW&&!workout;
      S.checkins.push({id:d+c.id,clientId:c.id,date:d,
        steps:Math.round((4000+rnd()*10000*p)/100)*100,
        workout, otherWorkout, workoutType:otherWorkout?types[Math.floor(rnd()*types.length)]:'',
        sleep:Math.round((5.5+rnd()*3)*2)/2, water:Math.round(4+rnd()*6),
        protein:rnd()<p, mobility:rnd()<p*.7, sunlight:rnd()<p*.8, encouraged:rnd()<p*.6,
        mood:Math.ceil(rnd()*5), notes:''});
    });
  }
}

/* ---------- scoring engine ---------- */
function dailyPoints(ci){
  const P=S.points,T=S.thresholds;
  const base=P.checkin;
  const steps=ci.steps>=T.steps3?P.steps3:ci.steps>=T.steps2?P.steps2:ci.steps>=T.steps1?P.steps1:0;
  const habits=(ci.workout?P.workout:0)+(ci.otherWorkout?P.otherWorkout:0)+(ci.sleep>=T.sleep?P.sleep:0)+(ci.water>=T.water?P.water:0)
    +(ci.protein?P.protein:0)+(ci.mobility?P.mobility:0)+(ci.sunlight?P.sunlight:0)+(ci.encouraged?P.encourage:0);
  return {base,steps,habits,total:base+steps+habits};
}
function streakOf(clientId){
  const set=new Set(S.checkins.filter(c=>c.clientId===clientId).map(c=>c.date));
  let n=0,d=new Date();
  if(!set.has(iso(d))) d=new Date(d.getTime()-DAY); // today not logged yet still counts yesterday's run
  while(set.has(iso(d))){n++;d=new Date(d.getTime()-DAY)}
  return n;
}
function weekStats(clientId,wk){
  const days=weekDays(wk);
  const rows=S.checkins.filter(c=>c.clientId===clientId&&days.includes(c.date));
  const T=S.thresholds;
  const s={checkins:rows.length,points:0,steps:0,workouts:0,sleepSum:0,sleepDays:0,waterDays:0,encourage:0,proteinDays:0,mobilityDays:0,streakBonus:0,challenge:0};
  rows.forEach(r=>{const p=dailyPoints(r);s.points+=p.total;s.steps+=r.steps;if(r.workout||r.otherWorkout)s.workouts++;s.sleepSum+=r.sleep;if(r.sleep>=T.sleep)s.sleepDays++;if(r.water>=T.water)s.waterDays++;if(r.encouraged)s.encourage++;if(r.protein)s.proteinDays++;if(r.mobility)s.mobilityDays++;});
  if(s.checkins>=7){s.streakBonus=S.points.streak;s.points+=s.streakBonus}
  const ch=challengeFor(wk); if(ch&&S.awards[wk]===clientId){s.challenge=ch.bonus;s.points+=s.challenge}
  s.avgSteps=rows.length?Math.round(s.steps/rows.length):0;
  s.avgSleep=rows.length?+(s.sleepSum/rows.length).toFixed(1):0;
  s.streak=streakOf(clientId);
  return s;
}
function leaderboard(wk){
  const rows=S.clients.map(c=>({client:c,...weekStats(c.id,wk)})).sort((a,b)=>b.points-a.points||b.workouts-a.workouts||a.client.name.localeCompare(b.client.name));
  let rank=0,prev=null;rows.forEach((r,i)=>{if(r.points!==prev){rank=i+1;prev=r.points}r.rank=rank});
  return rows;
}
function challengeFor(wk){const cs=fromIso(S.challengeStart),n=Math.round((fromIso(wk)-cs)/(7*DAY));if(n<0)return null;return S.challenges[n%S.challenges.length]}
function challengeLeader(wk){const ch=challengeFor(wk);if(!ch)return null;const rows=leaderboard(wk);const m=ch.metric;const top=[...rows].sort((a,b)=>b[m]-a[m])[0];return top&&top[m]>0?{row:top,value:top[m]}:null}

/* ---------- session ---------- */
function sess(){try{return JSON.parse(sessionStorage.getItem('peakfit.sess')||'null')}catch(e){return null}}
function setSess(v){try{v?sessionStorage.setItem('peakfit.sess',JSON.stringify(v)):sessionStorage.removeItem('peakfit.sess')}catch(e){}}
function me(){const s=sess();return s&&s.clientId?S.clients.find(c=>c.id===s.clientId):null}
function isCoach(){const s=sess();return !!(s&&s.coach)}

/* ---------- router ---------- */
const ROUTES={'':home,'checkin':checkin,'me':mine,'coach':coach};
const NAV=[['','Board',icoBoard],['checkin','Check in',icoCheck],['me','Me',icoMe],['coach','Coach',icoCoach]];
function icoBoard(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20 L9 8 L13 14 L16 10 L21 20 Z"/></svg>'}
function icoCheck(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>'}
function icoMe(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'}
function icoCoach(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>'}
function route(){const h=location.hash.replace(/^#\/?/,'').split('?')[0];const fn=ROUTES[h]||home;renderNav(h);document.getElementById('app').innerHTML=fn();bind();window.scrollTo(0,0)}
function renderNav(h){
  document.getElementById('tabs').innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" class="${k===h?'on':''}">${l}</a>`).join('');
  document.getElementById('mnav').innerHTML=NAV.map(([k,l,i])=>`<a href="#/${k}" class="${k===h?'on':''}">${i()}${l}</a>`).join('');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
const sleepFmt=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return M?`${H}h ${M}m`:`${H}h`};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- views ---------- */
function podium(rows){
  const top=rows.filter(r=>r.points>0).slice(0,3);
  if(!top.length) return '<div class="podium empty">No check-ins yet this week. Standings appear as soon as the first client logs a day.</div>';
  return `<div class="podium">${top.map(r=>`<div class="p p${r.rank}">
    <div class="rk">${r.rank}</div>
    <div class="nm">${esc(r.client.name)}</div>
    <div class="pts">${r.points}<small>pts</small></div>
    <div class="meta">${r.workouts} workout${r.workouts===1?'':'s'} · ${r.avgSteps.toLocaleString()} avg steps · ${r.streak}-day streak</div>
  </div>`).join('')}</div>`;
}
function home(){
  const wk=currentWeekKey(),rows=leaderboard(wk),ch=challengeFor(wk),lead=challengeLeader(wk);
  const topStreak=[...rows].sort((a,b)=>b.streak-a.streak)[0];
  const totalW=rows.reduce((a,r)=>a+r.workouts,0),totalSteps=rows.reduce((a,r)=>a+r.steps,0),active=rows.filter(r=>r.checkins>0).length;
  const you=me();
  const metricLabel={steps:'steps',workouts:'workouts',sleepDays:'nights',checkins:'days',encourage:'shout-outs',waterDays:'days'}[ch?ch.metric:'steps'];
  return `
  <section class="hero">
    <div class="herohead">
      <div><p class="eyebrow">Week ${weekNumber()} · ${fmt(wk)} – ${fmt(weekDays(wk)[6])}</p><h1>Weekly Standings</h1></div>
      <p class="lede">Points for every workout, step goal, and healthy habit logged. Standings reset each Monday; streaks carry over.</p>
    </div>
    ${podium(rows)}
  </section>
  <section class="tiles">
    ${ch?`<div class="tile ch"><div><div class="l">Week ${weekNumber()} challenge</div><div class="v">${esc(ch.name)}</div><div class="s">${esc(ch.how)} · +${ch.bonus} pts</div></div>
      <div class="lead">${S.awards[wk]?`<div class="l">Awarded to</div><div class="v">${esc(S.clients.find(c=>c.id===S.awards[wk])?.name||'')}</div>`:lead?`<div class="l">Currently leading</div><div class="v">${esc(lead.row.client.name)}</div><div class="s">${lead.value.toLocaleString()} ${metricLabel}</div>`:`<div class="l">Wide open</div>`}</div></div>`:''}
    <div class="tile"><div class="v">${topStreak&&topStreak.streak?topStreak.streak:0}</div><div class="l">Top streak</div><div class="s">${topStreak&&topStreak.streak?esc(topStreak.client.name):'No streaks yet'}</div></div>
    <div class="tile"><div class="v">${totalW}</div><div class="l">Workouts this week</div><div class="s">whole group</div></div>
    <div class="tile"><div class="v">${(totalSteps/1000).toFixed(0)}K</div><div class="l">Steps this week</div><div class="s">whole group</div></div>
    <div class="tile"><div class="v">${rows.filter(r=>r.checkins>=7).length}</div><div class="l">Perfect weeks</div><div class="s">7 of 7 check-ins</div></div>
  </section>
  <section class="board">
    <header><h2>Standings</h2><span class="sub">Points reset every Monday</span></header>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Client</th><th>Points</th><th>Workouts</th><th>Avg steps</th><th>Avg sleep</th><th>Check-ins</th><th>Streak</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="r${r.rank}"><td class="rk">${r.rank}</td><td><span class="nm">${esc(r.client.name)}</span>${you&&you.id===r.client.id?'<span class="you">you</span>':''}</td><td class="pts">${r.points}</td><td>${r.workouts}</td><td>${r.avgSteps.toLocaleString()}</td><td>${r.avgSleep?r.avgSleep+'h':'–'}</td><td>${r.checkins}/7</td><td><span class="streak ${r.streak>=7?'hot':''}">${r.streak}d</span></td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;
}

let pinBuf='',pinWho=null;
function pinScreen(title,hint,who){
  return `<div class="card" style="max-width:460px;margin:20px auto">
    <h2>${title}</h2><p class="hint">${hint}</p>
    ${who?`<div class="who" id="who">${S.clients.map(c=>`<button data-who="${c.id}" class="${pinWho===c.id?'on':''}">${esc(c.name)}</button>`).join('')}</div>`:''}
    <div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
    <div class="pinpad" id="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" aria-label="Clear">⌫</button><button data-k="0">0</button><button data-k="go" aria-label="Enter">↵</button></div>
    <div class="err" id="pinerr"></div>
  </div>`;
}
function checkin(){
  const c=me(); if(!c) return pinScreen('Check in','Tap your name, then enter your 4-digit PIN.',true);
  const d=today(),ex=S.checkins.find(x=>x.clientId===c.id&&x.date===d)||{};
  const T=S.thresholds,P=S.points;
  const tog=(k,l,s,on)=>`<div class="toggle ${on?'on':''}" data-t="${k}" role="switch" aria-checked="${!!on}" tabindex="0"><div><b>${l}</b><small>${s}</small></div><div class="sw"></div></div>`;
  return `<div class="card">
    <div class="mehead"><div><h2>${ex.id?'Update today':'Log today'}</h2><p class="hint">${fmt(d)} · ${esc(c.name)} · <a href="#/checkin" id="signout">not you?</a></p></div></div>
    <form id="ci" style="margin-top:18px;display:grid;gap:14px">
      <div class="grid2">
        <label class="f"><span>Steps</span><input class="in" type="number" inputmode="numeric" name="steps" min="0" step="100" value="${ex.steps??''}" placeholder="e.g. 8,200"></label>
        <label class="f"><span>Sleep</span><div class="row" style="flex-wrap:nowrap"><input class="in" type="number" inputmode="numeric" name="sleepH" min="0" max="16" value="${ex.sleep!=null?Math.floor(ex.sleep):''}" placeholder="hrs" aria-label="Sleep hours"><input class="in" type="number" inputmode="numeric" name="sleepM" min="0" max="59" value="${ex.sleep!=null?Math.round((ex.sleep%1)*60):''}" placeholder="min" aria-label="Sleep minutes"></div></label>
        <label class="f"><span>Water (cups)</span><input class="in" type="number" inputmode="numeric" name="water" min="0" max="30" value="${ex.water??''}" placeholder="8 hits the goal"></label>
        <label class="f"><span>Mood Today</span><select class="in" name="mood">${[1,2,3,4,5].map(n=>`<option value="${n}" ${(ex.mood||3)==n?'selected':''}>${['😩 Rough','😕 Meh','😐 Okay','🙂 Good','🔥 Great'][n-1]}</option>`).join('')}</select></label>
      </div>
      <div class="grid2">
        ${tog('workout','Peak Workout completed',`+${P.workout} pts`,ex.workout)}
        ${tog('otherWorkout','Other workout completed',`cardio, yoga, other gym session… +${P.otherWorkout} pts`,ex.otherWorkout)}
        ${tog('protein','Hit Protein Goal',`+${P.protein} pts`,ex.protein)}
        ${tog('mobility','Mobility / Stretching',`+${P.mobility} pts`,ex.mobility)}
        ${tog('sunlight','Morning Sunlight',`+${P.sunlight} pts`,ex.sunlight)}
        ${tog('encouraged','Encouraged a Teammate',`+${P.encourage} pts`,ex.encouraged)}
      </div>
      <label class="f" id="wtWrap" style="${ex.otherWorkout?'':'display:none'}"><span>What kind of workout?</span><input class="in" name="workoutType" value="${esc(ex.workoutType||'')}" placeholder="Weight training, run, HIIT…"></label>
      <label class="f"><span>Notes (coach sees these)</span><textarea class="in" name="notes" placeholder="How did it go?">${esc(ex.notes||'')}</textarea></label>
      <div class="live" id="live"></div>
      <div class="row"><button class="btn sum" type="submit">${ex.id?'Save changes':'Log my day'}</button>${ex.id?'<button class="btn ghost" type="button" id="del">Remove today</button>':''}</div>
    </form>
  </div>`;
}
function readForm(){
  const f=document.getElementById('ci'),fd=new FormData(f),t=k=>f.querySelector(`[data-t="${k}"]`).classList.contains('on');
  return {steps:+fd.get('steps')||0,sleep:+(Math.max(0,+fd.get('sleepH')||0)+Math.min(59,Math.max(0,+fd.get('sleepM')||0))/60).toFixed(4),water:+fd.get('water')||0,mood:+fd.get('mood')||3,workout:t('workout'),otherWorkout:t('otherWorkout'),protein:t('protein'),mobility:t('mobility'),sunlight:t('sunlight'),encouraged:t('encouraged'),workoutType:fd.get('workoutType')||'',notes:fd.get('notes')||''};
}
function updLive(){
  const l=document.getElementById('live');if(!l)return;
  const v=readForm(),p=dailyPoints(v),c=me();
  const stats=weekStats(c.id,currentWeekKey());
  l.innerHTML=`<div><div class="v">+${p.total}</div><div class="l">points today</div></div><div class="br"><span>Check-in ${p.base}</span><span>Steps ${p.steps}</span><span>Habits ${p.habits}</span><span>Streak ${stats.streak}d</span></div>`;
}
function mine(){
  const c=me(); if(!c) return pinScreen('Your stats','Tap your name, then enter your PIN.',true);
  const wk=currentWeekKey(),rows=leaderboard(wk),row=rows.find(r=>r.client.id===c.id),days=weekDays(wk);
  const byDay=days.map(d=>{const x=S.checkins.find(k=>k.clientId===c.id&&k.date===d);return x?dailyPoints(x).total:0});
  const max=Math.max(60,...byDay);
  const all=S.checkins.filter(k=>k.clientId===c.id);
  const lifetime=all.reduce((a,k)=>a+dailyPoints(k).total,0);
  const best=Math.max(0,...all.map(k=>k.steps));
  const bestStreak=(()=>{const set=new Set(all.map(k=>k.date));let b=0;set.forEach(d=>{if(set.has(iso(new Date(fromIso(d).getTime()-DAY))))return;let n=0,x=fromIso(d);while(set.has(iso(x))){n++;x=new Date(x.getTime()+DAY)}b=Math.max(b,n)});return b})();
  const badges=[['First check-in',all.length>0],['10K day',best>=10000],['Hat trick · 3 workouts in a week',row.workouts>=3],['7-day streak',bestStreak>=7],['Perfect week',row.checkins>=7],['Team player · 3 shout-outs',row.encourage>=3],['Summit · ranked #1',row.rank===1&&row.points>0]];
  const ahead=rows.find(r=>r.rank===row.rank-1);
  const hist=[...all].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
  return `<div class="card">
    <div class="mehead"><div><h1>${esc(c.name)}</h1><p class="hint">${row.points} points this week · ${row.checkins}/7 check-ins · <a href="#/me" id="signout">sign out</a></p></div><div class="rank">#${row.rank}<small>${row.rank===1?'You hold the summit':ahead?`${ahead.points-row.points+1} pts to pass ${esc(ahead.client.name)}`:'of '+rows.length}</small></div></div>
    <div class="row" style="margin-top:16px"><a class="btn sum" href="#/checkin" style="text-decoration:none">${S.checkins.some(k=>k.clientId===c.id&&k.date===today())?'Update today\u2019s check-in':'Log today'}</a></div>
    <div class="bars">${byDay.map((v,i)=>`<div class="${days[i]===today()?'today':''}" style="height:${Math.max(3,v/max*100)}%"><span>${v||''}</span></div>`).join('')}</div>
    <div class="days">${days.map(d=>`<div>${fromIso(d).toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('')}</div>
  </div>
  <div class="tiles">
    <div class="tile"><div class="v">${row.streak}</div><div class="l">Current streak</div><div class="s">best ${bestStreak} days</div></div>
    <div class="tile"><div class="v">${row.avgSteps.toLocaleString()}</div><div class="l">Avg steps this week</div><div class="s">best day ${best.toLocaleString()}</div></div>
    <div class="tile"><div class="v">${row.avgSleep||'–'}</div><div class="l">Avg sleep</div><div class="s">goal ${S.thresholds.sleep}h</div></div>
    <div class="tile"><div class="v">${lifetime}</div><div class="l">All-time points</div><div class="s">${all.length} days logged</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Badges</h2><div class="badges">${badges.map(([l,e])=>`<span class="badge ${e?'earned':''}">${l}</span>`).join('')}</div></div>
  <div class="card"><h2>Recent days</h2><div class="hist">${hist.length?hist.map(k=>{const p=dailyPoints(k);return `<div class="h"><div><b>${fmt(k.date)}</b><small> · ${k.steps.toLocaleString()} steps · ${sleepFmt(k.sleep)} sleep${k.workout?' · Peak Workout':''}${k.otherWorkout?' · '+esc(k.workoutType||'other workout'):''}</small></div><b>+${p.total}</b></div>`}).join(''):'<p class="hint">Nothing logged yet. Your first check-in starts the streak.</p>'}</div></div>`;
}
function coach(){
  if(!isCoach()) return pinScreen('Coach','Enter the coach PIN to manage clients, points, and challenges.',false);
  const wk=currentWeekKey(),rows=leaderboard(wk),ch=challengeFor(wk),lead=challengeLeader(wk);
  const P=S.points,T=S.thresholds;
  const notes=S.checkins.filter(k=>k.notes&&weekDays(wk).includes(k.date)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card">
    <div class="mehead"><div><h2>Coach dashboard</h2><p class="hint">Week ${weekNumber()} · ${rows.filter(r=>r.checkins>0).length} active · <a href="#/coach" id="signout">sign out</a></p></div></div>
    <div class="note" style="margin-top:14px">Front-end preview: everything here is stored in this browser only. Once connected to Supabase, PINs, check-ins, and standings sync across every client's phone and the gym display.</div>
  </div>
  <div class="card"><h2>This week's challenge</h2>
    ${ch?`<p class="hint"><b>${esc(ch.name)}</b> — ${esc(ch.how)} (+${ch.bonus} pts)</p>
    <div class="row" style="margin-top:12px">
      <select class="in" id="award" style="max-width:260px"><option value="">— not awarded yet —</option>${S.clients.map(c=>`<option value="${c.id}" ${S.awards[wk]===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <button class="btn sm" id="awardBtn">Award bonus</button>
      ${lead?`<span class="hint">Leading now: ${esc(lead.row.client.name)}</span>`:''}
    </div>`:''}
  </div>
  <div class="card"><h2>Clients &amp; PINs</h2><p class="hint">Clients pick their name and enter this PIN. Tap a PIN to change it.</p>
    <div class="roster" style="margin-top:12px" id="roster">${S.clients.map(c=>`<div class="r"><div><div class="nm">${esc(c.name)}</div><small style="color:var(--ink-3)">${rows.find(r=>r.client.id===c.id).points} pts · ${streakOf(c.id)}d streak</small></div><div class="row"><button class="btn ghost sm pin" data-pin="${c.id}">${c.pin}</button><button class="btn ghost sm" data-rm="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button></div></div>`).join('')}</div>
    <form class="row" id="addc" style="margin-top:12px"><input class="in" name="name" placeholder="New client's first name or nickname" required style="max-width:320px"><button class="btn sm">Add client</button></form>
  </div>
  <div class="card"><h2>Point values</h2><p class="hint">Change these to tune the game. The whole board recalculates instantly.</p>
    <form id="pts" class="ptgrid" style="margin-top:12px">
      <span>Daily check-in</span><input class="in" name="checkin" type="number" value="${P.checkin}">
      <span>Peak Workout Completed</span><input class="in" name="workout" type="number" value="${P.workout}">
      <span>Other Workout Completed <small style="color:var(--ink-3)">(cardio, yoga, other gym session, etc.)</small></span><input class="in" name="otherWorkout" type="number" value="${P.otherWorkout}">
      <span>${T.steps1.toLocaleString()}+ steps</span><input class="in" name="steps1" type="number" value="${P.steps1}">
      <span>${T.steps2.toLocaleString()}+ steps</span><input class="in" name="steps2" type="number" value="${P.steps2}">
      <span>${T.steps3.toLocaleString()}+ steps</span><input class="in" name="steps3" type="number" value="${P.steps3}">
      <span>Sleep ${T.sleep}h+</span><input class="in" name="sleep" type="number" value="${P.sleep}">
      <span>Water ${T.water}+ cups</span><input class="in" name="water" type="number" value="${P.water}">
      <span>Protein goal</span><input class="in" name="protein" type="number" value="${P.protein}">
      <span>Mobility</span><input class="in" name="mobility" type="number" value="${P.mobility}">
      <span>Morning Sunlight</span><input class="in" name="sunlight" type="number" value="${P.sunlight}">
      <span>Encouraged someone</span><input class="in" name="encourage" type="number" value="${P.encourage}">
      <span>7-day streak bonus</span><input class="in" name="streak" type="number" value="${P.streak}">
      <span>Coach PIN</span><input class="in" name="coachPin" inputmode="numeric" pattern="\\d{4}" maxlength="4" value="${S.coachPin}">
      <div></div><button class="btn sm">Save</button>
    </form>
  </div>
  <div class="card"><h2>Challenge rotation</h2><div class="chal" style="margin-top:12px">${S.challenges.map((c,i)=>`<div class="c ${ch===c?'now':''}"><div><b>${esc(c.name)}</b><br><small>${esc(c.how)}</small></div><div>+${c.bonus}</div></div>`).join('')}</div></div>
  <div class="card"><h2>Client notes this week</h2><div class="hist" style="margin-top:12px">${notes.length?notes.map(k=>`<div class="h"><div><b style="font-size:16px">${esc(S.clients.find(c=>c.id===k.clientId)?.name||'')}</b><small> · ${fmt(k.date)}</small><div>${esc(k.notes)}</div></div></div>`).join(''):'<p class="hint">No notes yet.</p>'}</div></div>
  <div class="card"><h2>Danger zone</h2><div class="row" style="margin-top:12px"><button class="btn danger sm" id="wipe">Reset demo data</button><span class="hint">Restores the sample roster and check-ins.</span></div></div>`;
}

/* ---------- bindings ---------- */
function bind(){
  const app=document.getElementById('app');
  const so=app.querySelector('#signout'); if(so) so.addEventListener('click',e=>{e.preventDefault();setSess(null);pinBuf='';pinWho=null;route()});
  const pad=app.querySelector('#pad');
  if(pad){
    const isCoachScreen=!app.querySelector('#who');
    app.querySelectorAll('#who button').forEach(b=>b.addEventListener('click',()=>{pinWho=b.dataset.who;app.querySelectorAll('#who button').forEach(x=>x.classList.toggle('on',x===b))}));
    const tryPin=()=>{
      const err=app.querySelector('#pinerr');
      if(isCoachScreen){ if(pinBuf===S.coachPin){setSess({coach:true});pinBuf='';route();return} }
      else{ if(!pinWho){err.textContent='Tap your name first.';pinBuf='';drawDots();return}
        const c=S.clients.find(x=>x.id===pinWho); if(c&&c.pin===pinBuf){setSess({clientId:c.id});pinBuf='';route();return} }
      err.textContent='That PIN didn\u2019t match. Try again.';pinBuf='';drawDots();
    };
    const drawDots=()=>{app.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length))};
    pad.addEventListener('click',e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;
      if(k==='x'){pinBuf=pinBuf.slice(0,-1)}else if(k==='go'){if(pinBuf.length===4)tryPin();return}else if(pinBuf.length<4){pinBuf+=k}
      drawDots(); if(pinBuf.length===4) setTimeout(tryPin,120);
    });
    window.onkeydown=e=>{if(/^\d$/.test(e.key)&&pinBuf.length<4){pinBuf+=e.key;drawDots();if(pinBuf.length===4)setTimeout(tryPin,120)}else if(e.key==='Backspace'){pinBuf=pinBuf.slice(0,-1);drawDots()}};
  } else window.onkeydown=null;

  const ci=app.querySelector('#ci');
  if(ci){
    ci.querySelectorAll('.toggle').forEach(t=>{const flip=()=>{t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'));if(t.dataset.t==='otherWorkout')app.querySelector('#wtWrap').style.display=t.classList.contains('on')?'':'none';updLive()};t.addEventListener('click',flip);t.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}})});
    ci.addEventListener('input',updLive); updLive();
    ci.addEventListener('submit',e=>{e.preventDefault();const c=me(),d=today(),v=readForm();
      const i=S.checkins.findIndex(x=>x.clientId===c.id&&x.date===d);
      const rec={id:d+c.id,clientId:c.id,date:d,...v};
      if(i>=0)S.checkins[i]=rec;else S.checkins.push(rec);
      save();const p=dailyPoints(rec);toast(`Logged · +${p.total} points`);location.hash='#/me'});
    const del=app.querySelector('#del'); if(del) del.addEventListener('click',()=>{const c=me(),d=today();S.checkins=S.checkins.filter(x=>!(x.clientId===c.id&&x.date===d));save();toast('Removed today\u2019s check-in');route()});
  }

  const aw=app.querySelector('#awardBtn'); if(aw) aw.addEventListener('click',()=>{const v=app.querySelector('#award').value,wk=currentWeekKey();if(v)S.awards[wk]=v;else delete S.awards[wk];save();toast(v?'Bonus awarded':'Award cleared');route()});
  app.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',()=>{const c=S.clients.find(x=>x.id===b.dataset.pin);const p=prompt(`New 4-digit PIN for ${c.name}`,c.pin);if(p&&/^\d{4}$/.test(p)){c.pin=p;save();route()}else if(p!==null)toast('PIN must be 4 digits')}));
  app.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{const c=S.clients.find(x=>x.id===b.dataset.rm);if(confirm(`Remove ${c.name} and all their check-ins?`)){S.clients=S.clients.filter(x=>x!==c);S.checkins=S.checkins.filter(x=>x.clientId!==c.id);save();route()}}));
  const addc=app.querySelector('#addc'); if(addc) addc.addEventListener('submit',e=>{e.preventDefault();const n=new FormData(addc).get('name').trim();if(!n)return;const pin=String(1000+Math.floor(Math.random()*9000));S.clients.push({id:'c'+Date.now(),name:n,pin});save();toast(`${n} added · PIN ${pin}`);route()});
  const pts=app.querySelector('#pts'); if(pts) pts.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(pts);for(const k of Object.keys(S.points))S.points[k]=+fd.get(k)||0;const cp=fd.get('coachPin');if(/^\d{4}$/.test(cp))S.coachPin=cp;save();toast('Saved');route()});
  const wipe=app.querySelector('#wipe'); if(wipe) wipe.addEventListener('click',()=>{if(confirm('Reset all data to the demo roster?')){reset();toast('Demo data restored');route()}});
}

load();
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
